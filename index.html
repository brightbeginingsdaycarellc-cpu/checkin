     */
    App.whatsappVerify = function (opts) {
      var el = App.el, v = opts.v;
      var stopped = false, inFlight = false;
      function check() {
        if (stopped || inFlight) return;
        if (Date.now() > v.expiresAt) { stop(); opts.onExpired('This sign-in has expired. Please start again.'); return; }
        inFlight = true;
        App.rpc(opts.action, { verifyId: v.verifyId }).then(function (res) {
          inFlight = false;
          if (stopped) return;
          if (res.ok) { stop(); opts.onDone(res); return; }
          if (res.code === 'pending' || res.code === 'network') return;   // keep waiting
          stop();
          opts.onExpired(res.message);
        });
      }
      function onVisible() { if (document.visibilityState === 'visible') check(); }
      var timer = setInterval(check, 3000);
      document.addEventListener('visibilitychange', onVisible);
      w.addEventListener('focus', check);
      function stop() {
        stopped = true;
        clearInterval(timer);
        document.removeEventListener('visibilitychange', onVisible);
        w.removeEventListener('focus', check);
      }
      var nodes = [
        el('a', { class: 'btn primary block', href: v.waLink, target: '_blank', rel: 'noopener', text: 'Open WhatsApp to send it' }),
        el('div', { class: 'card center', style: 'margin-top:14px' }, [
          el('div', { class: 'muted small', text: 'The message to send to ' + v.daycareNumber + ':' }),
          el('div', { class: 'verify-code', text: v.message })
        ]),
        el('div', { class: 'loading', role: 'status' }, [el('span', { class: 'spinner', 'aria-hidden': 'true' }), 'Waiting for your WhatsApp message…']),
        el('button', { class: 'btn block', type: 'button', text: 'I sent it — check now', onclick: check })
      ];
      return { nodes: nodes, stop: stop };
    };

    /** A sign-in in progress survives switching to WhatsApp and back, even if the page reloads. */
    App.pending = {
      save: function (key, v) {
        v.expiresAt = v.expiresAt || Date.now() + (v.expiresInSec || 600) * 1000;
        App.store.set(key, JSON.stringify(v));
        return v;
      },
      load: function (key) {
        try {
          var v = JSON.parse(App.store.get(key) || 'null');
          return v && v.verifyId && v.expiresAt > Date.now() ? v : null;
        } catch (e) { return null; }
      },
      clear: function (key) { App.store.del(key); }
    };

    App.todayKey = function () {
      var d = new Date();
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    };

    w.App = App;
  })(window);
</script>

<script>
  window.__parentApp = function () {

  /* Parent and pickup-person page (BRD section 5, parent journey). */
  (function () {
    'use strict';
    var A = window.App, el = A.el;
    var root = A.$('app');
    var SESSION_KEY = 'dc.adult.session';
    var PHONE_KEY = 'dc.adult.phone';
    var PENDING_KEY = 'dc.adult.pending';
    var state = { session: A.store.get(SESSION_KEY), selected: {}, home: null, poller: null };

    function show(nodes) {
      if (state.poller) { state.poller.stop(); state.poller = null; }
      A.clear(root);
      var name = BOOT.daycareName || 'Day care';
      root.appendChild(el('div', { class: 'brand' }, [
        el('span', { class: 'brand-mark', 'aria-hidden': 'true', text: A.initials(name) }), el('span', { class: 'brand-name', text: name })]));
      nodes.forEach(function (n) { if (n) root.appendChild(n); });
      var focus = root.querySelector('[data-focus]');
      if (focus) focus.focus();
    }

    /** A round icon above the heading. tone: '' (teal), 'ok', 'warn' or 'bad'. */
    function heroIcon(name, tone) {
      return el('div', { class: 'hero-icon' + (tone ? ' ' + tone : '') }, [A.icon(name)]);
    }

    function messageScreen(title, text, kind, iconName) {
      show([
        heroIcon(iconName || (kind === 'warn' ? 'clock' : 'scan'), kind === 'warn' ? 'warn' : ''),
        el('h1', { text: title }),
        el('p', { class: 'sub', text: text }),
        kind ? A.notice(kind, kind === 'warn' ? 'The code on the screen changes every minute.' : '') : null
      ]);
    }

    function start() {
      // Came back from WhatsApp to a reloaded page: carry on waiting for the LOGIN message.
      var pending = !state.session && A.pending.load(PENDING_KEY);
      if (pending) return verifyScreen(pending);
      if (BOOT.scan === 'expired') return messageScreen('This code has expired', 'Scan the code on the day care screen again. It changes every minute.', 'warn');
      if (BOOT.scan !== 'ok' || !BOOT.grant) return messageScreen('Scan to check in', 'Use your phone camera to scan the code on the screen at the day care door.');
      if (state.session) return loadHome();
      phoneScreen();
    }

    function handleCommon(res) {
      if (res.code === 'scan_expired') { messageScreen('Please scan again', res.message); return true; }
      if (res.code === 'signed_out' || res.code === 'not_listed') {
        A.store.del(SESSION_KEY);
        state.session = null;
        if (res.code === 'not_listed') notListedScreen(res.message); else phoneScreen(res.message);
        return true;
      }
      return false;
    }

    // ---- Sign in (FR-03): phone number, then send "LOGIN <code>" on WhatsApp ----------------
    function phoneScreen(errorText) {
      var input = el('input', { type: 'tel', id: 'phone', autocomplete: 'tel', inputmode: 'tel', placeholder: '+1 202 555 0101',
        value: A.store.get(PHONE_KEY) || '', 'data-focus': true, 'aria-describedby': 'phone-hint' });
      var err = el('div');
      if (errorText) err.appendChild(A.notice('bad', errorText));
      var btn = el('button', { class: 'btn primary block', type: 'submit', text: 'Continue' });
      var form = el('form', { novalidate: true, onsubmit: function (ev) {
        ev.preventDefault();
        var phone = input.value.trim();
        if (!phone) { A.clear(err); err.appendChild(A.notice('bad', 'Enter your WhatsApp number.')); return; }
        var done = A.busy(btn, 'Please wait…');
        A.rpc('parent.startVerify', { grant: BOOT.grant, phone: phone }).then(function (res) {
          done();
          if (res.ok) { A.store.set(PHONE_KEY, phone); return verifyScreen(A.pending.save(PENDING_KEY, res)); }
          if (handleCommon(res)) return;
          if (res.code === 'not_found') return notFoundScreen(phone);
          if (res.code === 'not_opted_in') return optInScreen(phone, res.optInLink);
          A.clear(err); err.appendChild(A.notice('bad', res.message));
        });
      } }, [
        el('div', { class: 'field' }, [
          el('label', { for: 'phone', text: 'Your WhatsApp number' }),
          input,
          el('div', { class: 'hint', id: 'phone-hint', text: 'Include the country code. Next, you confirm it by sending us a short WhatsApp message.' })
        ]),
        err, btn
      ]);
      show([heroIcon('phone'), el('h1', { text: 'Sign in once' }), el('p', { class: 'sub', text: 'After this, scanning the code is all you need on this phone.' }), form]);
    }

    function verifyScreen(v) {
      var panel = A.whatsappVerify({
        v: v,
        action: 'parent.checkVerify',
        onDone: function (res) {
          A.pending.clear(PENDING_KEY);
          state.session = res.session;
          var kept = A.store.set(SESSION_KEY, res.session);
          if (BOOT.scan === 'ok' && BOOT.grant) return loadHome(kept ? '' : 'This browser may not keep you signed in, so you may need to confirm again next time.');
          messageScreen('You are signed in', 'Scan the code on the screen to check in or out.');
        },
        onExpired: function (msg) { A.pending.clear(PENDING_KEY); phoneScreen(msg); }
      });
      show([
        heroIcon('chat'),
        el('h1', { text: 'Confirm on WhatsApp' }),
        el('p', { class: 'sub', text: 'Send the message below to the day care from your WhatsApp, then come back to this page. You will be signed in automatically.' })
      ].concat(panel.nodes, [
        el('p', { class: 'footer' }, [el('button', { class: 'link', type: 'button', text: 'Use a different number', onclick: function () {
          A.pending.clear(PENDING_KEY); phoneScreen();
        } })])
      ]));
      state.poller = panel;
    }

    function optInScreen(phone, link) {
      show([
        heroIcon('chat'),
        el('h1', { text: 'Turn on WhatsApp alerts' }),
        el('p', { class: 'sub', text: 'Before we can message you, send START to the day care on WhatsApp. This also turns on your check-in confirmations.' }),
        link ? el('a', { class: 'btn primary block', href: link, target: '_blank', rel: 'noopener', text: 'Open WhatsApp and send START' })
          : A.notice('warn', 'Ask the day care for their WhatsApp number and send them the word START.'),
        el('p', { class: 'small muted', style: 'margin-top:14px', text: 'You can reply STOP at any time to turn alerts off.' }),
        el('button', { class: 'btn block', type: 'button', text: 'I sent START — send my code', 'data-focus': true, onclick: function () { A.store.set(PHONE_KEY, phone); phoneScreen(); } })
      ]);
    }

    function notFoundScreen(phone) {
      show([
        heroIcon('alert', 'warn'),
        el('h1', { text: 'Number not on file' }),
        el('p', { class: 'sub', text: 'We could not find ' + phone + ' at the day care. Check the number, or ask the day care to add you.' }),
        el('button', { class: 'btn block', type: 'button', text: 'Try another number', 'data-focus': true, onclick: function () { phoneScreen(); } }),
        el('div', { class: 'card', style: 'margin-top:18px' }, [
          el('h2', { text: 'Here to pick up a child?' }),
          el('p', { class: 'muted small', text: 'Only people on the pickup list can check a child out. Tell us who you are and we will let the day care know.' }),
          el('button', { class: 'btn block', type: 'button', text: 'Tell the day care', onclick: unlistedScreen })
        ])
      ]);
    }

    function notListedScreen(text) {
      show([
        heroIcon('user', 'warn'),
        el('h1', { text: 'You are not listed' }),
        el('p', { class: 'sub', text: text || 'You are not listed for any child right now.' }),
        el('button', { class: 'btn block', type: 'button', text: 'Tell the day care you are here', 'data-focus': true, onclick: unlistedScreen })
      ]);
    }

    // ---- FR-11: someone not on the list says who they came for ----------------------------
    function unlistedScreen() {
      var name = el('input', { type: 'text', id: 'uname', autocomplete: 'name', maxlength: '60', 'data-focus': true });
      var child = el('input', { type: 'text', id: 'uchild', maxlength: '40' });
      var err = el('div');
      var btn = el('button', { class: 'btn primary block', type: 'submit', text: 'Tell the day care' });
      show([
        heroIcon('user'),
        el('h1', { text: 'Who are you picking up?' }),
        el('p', { class: 'sub', text: 'The day care will be told right away. Please wait for a staff member.' }),
        el('form', { novalidate: true, onsubmit: function (ev) {
          ev.preventDefault();
          if (!name.value.trim() || !child.value.trim()) { A.clear(err); err.appendChild(A.notice('bad', 'Enter both names.')); return; }
          var done = A.busy(btn, 'Sending…');
          A.rpc('parent.reportUnlisted', { grant: BOOT.grant, name: name.value, child: child.value }).then(function (res) {
            done();
            if (res.ok) return messageScreen('Thank you', res.message);
            if (handleCommon(res)) return;
            A.clear(err); err.appendChild(A.notice('bad', res.message));
          });
        } }, [
          el('div', { class: 'field' }, [el('label', { for: 'uname', text: 'Your name' }), name]),
          el('div', { class: 'field' }, [el('label', { for: 'uchild', text: 'Child’s first name' }), child]),
          err, btn
        ])
      ]);
    }

    // ---- Home: tap a child, then confirm (FR-04, FR-05) -------------------------------------
    function loadHome(warning) {
      state.warning = warning || '';
      // The standalone page gets the children together with the scan (BOOT.home); use that once.
      var pre = BOOT.home;
      BOOT.home = null;
      if (pre && state.session) return showHome(pre);
      show([A.loading('Loading your children…')]);
      A.rpc('parent.home', { session: state.session, grant: BOOT.grant }).then(showHome);
    }

    function showHome(res) {
      if (!res.ok) { if (!handleCommon(res)) messageScreen('Something went wrong', res.message, '', 'offline'); return; }
      state.home = res;
      state.selected = {};
      if (res.codeUsed) return messageScreen('Already used', 'This code was already used on this phone. Scan the new code on the screen to check in or out again.', 'warn');
      if (!res.children.length) return notListedScreen('No children are linked to you yet. Please ask the day care.');
      renderHome();
    }

    function actionLabel(type) { return type === 'in' ? 'Check in' : 'Check out'; }

    function joinNames(list) {
      if (list.length <= 1) return list.join('');
      return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
    }

    function summary() {
      var ins = [], outs = [];
      state.home.children.forEach(function (c) { if (state.selected[c.id]) (c.action === 'in' ? ins : outs).push(c.name); });
      var parts = [];
      if (ins.length) parts.push('Check in ' + joinNames(ins));
      if (outs.length) parts.push((parts.length ? 'check out ' : 'Check out ') + joinNames(outs));
      return parts.join(', ');
    }

    function greeting() {
      var h = new Date().getHours();
      var first = String(state.home.name || '').split(/\s+/)[0];
      return (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + (first ? ', ' + first : '');
    }

    function renderHome() {
      var list = el('div', { role: 'group', 'aria-label': 'Your children' });
      var submit = el('button', { class: 'btn primary block', type: 'button', disabled: true, text: 'Tap a child above', onclick: doSubmit });
      state.home.children.forEach(function (c) {
        var meta = c.status === 'in' ? 'Here since ' + c.since : (c.since ? 'Left at ' + c.since : 'Not here yet');
        var chip = c.status === 'in' ? 'here' : (c.since ? 'gone' : 'waiting');
        var btn = el('button', {
          class: 'child', type: 'button', disabled: !c.action, 'aria-pressed': 'false',
          onclick: function () {
            state.selected[c.id] = !state.selected[c.id];
            btn.classList.toggle('selected', !!state.selected[c.id]);
            btn.setAttribute('aria-pressed', state.selected[c.id] ? 'true' : 'false');
            var s = summary();
            submit.disabled = !s;
            submit.textContent = s || 'Tap a child above';
          }
        }, [
          A.avatar(c.name, c.photo),
          el('span', { style: 'min-width:0' }, [el('span', { class: 'name', text: c.name }), el('span', { class: 'chip ' + chip, text: meta })]),
          el('span', { class: 'pill ' + (c.action || 'none'), text: c.action ? actionLabel(c.action) : c.note })
        ]);
        list.appendChild(btn);
      });
      show([
        el('p', { class: 'hello', text: greeting() }),
        el('h1', { text: 'Check in or out' }),
        el('p', { class: 'sub', text: new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + ' · Tap a child, then confirm.' }),
        state.warning ? A.notice('warn', state.warning) : null,
        list, el('div', { class: 'submit-bar' }, [submit]),
        el('p', { class: 'footer' }, [
          'Signed in as ' + state.home.name + ' on this phone · ',
          el('button', { class: 'link', type: 'button', text: 'Not you?', onclick: function () {
            A.store.del(SESSION_KEY); state.session = null; phoneScreen();
          } })
        ])
      ]);
    }

    function doSubmit(ev) {
      var items = state.home.children.filter(function (c) { return state.selected[c.id] && c.action; })
        .map(function (c) { return { childId: c.id, type: c.action }; });
      if (!items.length) return;
      A.busy(ev.currentTarget, 'Saving…');
      A.rpc('parent.submit', { session: state.session, grant: BOOT.grant, items: items }).then(function (res) {
        if (!res.ok) {
          if (handleCommon(res)) return;
          if (res.code === 'code_used') return messageScreen('Already used', res.message, 'warn');
          return messageScreen('Not saved', res.message, '', 'alert');
        }
        resultsScreen(res);
      });
    }

    function resultsScreen(res) {
      var okCount = res.results.filter(function (r) { return r.ok; }).length;
      var rows = res.results.map(function (r) {
        var child = r.name || 'This child';
        return el('div', { class: 'result' }, [
          el('span', { class: 'ricon ' + (r.ok ? r.type : 'bad') }, [A.icon(r.ok ? r.type : 'alert')]),
          el('div', {}, [
            el('div', { style: 'font-weight:700', text: r.ok ? child + (r.type === 'in' ? ' checked in' : ' checked out') : child }),
            el('div', { class: r.ok ? 'rtime' : 'muted small', text: r.ok ? 'at ' + r.time : r.message })
          ])
        ]);
      });
      var confirm = {
        sent: A.notice('ok', 'A WhatsApp confirmation is on its way.'),
        failed: A.notice('warn', 'Saved. The WhatsApp confirmation could not be sent; the day care can see this.'),
        off: A.notice('info', 'Saved. WhatsApp alerts are off for your number, so no confirmation was sent.'),
        none: null
      }[okCount ? res.confirmation : 'none'];
      show([
        heroIcon(okCount ? 'here' : 'alert', okCount ? 'ok' : 'bad'),
        el('h1', { text: okCount ? 'All done' : 'Not saved' }),
        el('div', { class: 'card' }, rows),
        confirm,
        el('p', { class: 'footer', text: 'To check in or out again, scan the new code on the screen.' })
      ]);
    }

    start();
  })();
  
  };
</script>
<script>
  /* Start: turn the door code in the address into a scan grant, then run the parent screens. */
  (function () {
    'use strict';
    var A = window.App;
    var SCAN_KEY = 'dc.scan';
    var t = '';
    try { t = new URLSearchParams(window.location.search).get('t') || ''; } catch (e) { t = ''; }
    // Keep the code out of the address bar, history and any shared link.
    if (t && window.history && window.history.replaceState) window.history.replaceState(null, '', window.location.pathname);
    var saved = null;
    try { saved = JSON.parse(window.sessionStorage.getItem(SCAN_KEY) || 'null'); } catch (e) { saved = null; }

    // A signed-in phone sends its session with the scan and gets its children in the same reply.
    // The key is the one Parent.html uses (SESSION_KEY there).
    var session = t ? (A.store.get('dc.adult.session') || '') : '';

    function start() {
    A.rpc('parent.scan', { t: t, session: session }).then(function (res) {
      if (!res.ok) {
        var root = A.$('app');
        A.clear(root);
        root.appendChild(A.el('div', { class: 'hero-icon bad' }, [A.icon('offline')]));
        root.appendChild(A.el('h1', { text: 'Cannot reach the day care' }));
        root.appendChild(A.el('p', { class: 'sub', text: res.message || 'Check the internet connection and scan again.' }));
        // The door code is kept in memory (not in the address), so Try again reuses it.
        root.appendChild(A.el('button', { class: 'btn primary block', text: 'Try again', onclick: function () {
          A.clear(root);
          root.appendChild(A.loading());
          start();
        } }));
        return;
      }
      var boot = { daycareName: res.daycareName, grant: res.grant, scan: res.scan, home: res.home || null };
      if (boot.scan === 'ok') {
        try { window.sessionStorage.setItem(SCAN_KEY, JSON.stringify({ grant: boot.grant, at: Date.now() })); } catch (e) { /* ignore */ }
      } else if (!t && saved && saved.grant && Date.now() - saved.at < 5 * 60 * 1000) {
        // Same visit, page reloaded (e.g. after switching to WhatsApp): reuse this scan.
        boot.scan = 'ok';
        boot.grant = saved.grant;
      }
      if (boot.daycareName) document.title = boot.daycareName + ' · Check in';
      window.BOOT = boot;
      window.__parentApp();
    });
    }
    start();
  })();
</script>
